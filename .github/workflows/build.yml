name: Build Project (Debug)

on:
  push:
    branches: [ "main", "x/oob/5.4.x", "x/oob/6.1.x", "x/oob/7.0.x" ]
  pull_request:
    branches: [ "main", "x/oob/5.4.x", "x/oob/6.1.x", "x/oob/7.0.x" ]
    
jobs:
  build:
    strategy:
      matrix:
        runs-on: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'
          ref: ${{ github.ref }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Solution Compilation
        run: |
          pip install aptivi-adt
          adt build -b "-p:Configuration=Debug -p:ContinuousIntegrationBuild=true"
          adt checklocs
      - name: Testing
        run: adt test -t="--no-build --configuration Debug"
        
